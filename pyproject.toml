[project]
name = "mcp-server-mayhem"
version = "0.5.0"
description = "A Model Context Protocol server providing tools to execute mayhem"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    # Upper bound is load-bearing: mcp 2.x renamed FastMCP to MCPServer, so every
    # `from mcp.server.fastmcp import ...` in this package fails against it.
    "mcp>=1.6.0,<2",
    "pydantic>=2.11.3",
    "typer>=0.17.4",
]

[project.scripts]
mcp-server-mayhem = "mcp_server_mayhem.__main__:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
